<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración — SportClub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="theme-admin">
    <script>
        const session = JSON.parse(sessionStorage.getItem('sc_user') || 'null');
        if (!session || session.role !== 'admin') window.location.href = 'login.html';
    </script>

    <div class="d-flex">
        <aside class="sidebar-nav d-flex flex-column p-3 vh-100">
    <img src="../IMG/logo_empresa_letra_v1.png" alt="SportClub" class="logo mb-4 mx-auto">
    
    <nav class="nav flex-column gap-2" id="adminNav">
        <a href="#" class="nav-link active" data-view="view-dashboard">
            <i class="bi bi-speedometer2"></i> Dashboard
        </a>
        <a href="#" class="nav-link" data-view="view-users">
            <i class="bi bi-people"></i> Usuarios
        </a>
        <a href="#" class="nav-link">
            <i class="bi bi-trophy"></i> Deportes
        </a>
    </nav>

    <a href="index.html" class="nav-link mt-auto mb-3 opacity-75">
        <i class="bi bi-box-arrow-left"></i> Cerrar Sesión
    </a>
</aside>

        <main class="main-content flex-grow-1 p-4">
            
            <section id="view-dashboard" class="admin-view">
                <header class="mb-4">
                    <h1 class="h3 fw-bold">Panel de Control</h1>
                    <p class="text-muted">Resumen general del sistema SportClub.</p>
                </header>
                <div class="row g-4">
                    <div class="col-md-4">
                        <div class="card-dash p-4 text-center">
                            <h3 class="h6 opacity-75">SOCIOS TOTALES</h3>
                            <p class="display-6 fw-bold text-warning" id="stat-users">0</p>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card-dash p-4 text-center">
                            <h3 class="h6 opacity-75">ROLES ACTIVOS</h3>
                            <div class="d-flex justify-content-around mt-2">
                                <span class="badge bg-danger">Admin</span>
                                <span class="badge bg-primary">Coach</span>
                                <span class="badge bg-success">User</span>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <section id="view-users" class="admin-view d-none">
                <header class="d-flex justify-content-between align-items-end mb-4">
                    <div>
                        <h1 class="h3 fw-bold m-0">Gestión de Usuarios</h1> <p class="text-muted m-0">Administra los usuarios del sistema, sus roles y accesos.</p> </div>
                    <button class="btn btn-primary fw-bold" onclick="openModal()">
                        <i class="bi bi-plus-lg"></i> Nuevo Usuario
                    </button>
                </header>

                <div class="card border-0 shadow-sm overflow-hidden">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th>ID</th>
                                    <th>Nombre Completo</th>
                                    <th>Email</th>
                                    <th>Rol</th>
                                    <th>Fecha Registro</th> <th class="text-center">Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="usersTableBody"></tbody>
                        </table>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <div class="modal fade" id="userModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <form id="userForm" class="modal-content border-0 shadow" novalidate>
                <div class="modal-header border-bottom-0">
                    <h5 class="modal-title fw-bold" id="modalTitle">Nuevo Usuario</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body pt-0">
                    <input type="hidden" id="userId">
                    <div class="mb-3">
                        <label class="form-label small fw-bold">NOMBRE COMPLETO *</label>
                        <input type="text" id="full_name" class="form-control" required>
                        <div class="error-msg text-danger small mt-1" id="err_full_name"></div> </div>
                    <div class="mb-3">
                        <label class="form-label small fw-bold">EMAIL *</label>
                        <input type="email" id="email" class="form-control" required>
                        <div class="error-msg text-danger small mt-1" id="err_email"></div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-bold">ROL *</label>
                        <select id="role" class="form-select" required>
                            <option value="user">user</option>
                            <option value="coach">coach</option>
                            <option value="admin">admin</option>
                        </select>
                    </div>
                    <div id="passwordFields">
                        <div class="mb-3">
                            <label class="form-label small fw-bold">CONTRASEÑA *</label>
                            <input type="password" id="password" class="form-control">
                            <div class="error-msg text-danger small mt-1" id="err_password"></div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer border-top-0 pt-0">
                    <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary px-4 fw-bold">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/admin.js"></script>
</body>
</html>
