<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Usuarios - SportClub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="theme-admin">
    <script>
        const session = JSON.parse(sessionStorage.getItem('sc_user') || 'null');
        if (!session || session.role !== 'admin') window.location.href = 'login.html';
    </script>

    <main class="main-box">
        <header class="box-header d-flex justify-content-between align-items-center">
            <img src="../IMG/logo_empresa_letra_v1.png" alt="Logo" class="logo">
            <h2 class="m-0 h5 text-white fw-bold">ADMINISTRACIÓN</h2>
            <section class="d-flex gap-2">
                <a href="../html/index.html" class="btn-gold-sm">Cerrar Sesión</a>
            </section>
        </header>

        <section class="content-area">
            <header class="mb-4 d-flex justify-content-between align-items-center">
                <div>
                    <h2 class="welcome-title mb-1">Gestión de Usuarios</h2>
                    <p class="admin-welcome mb-0 text-muted">Administra los usuarios del sistema, sus roles y accesos.</p>
                </div>
                <button class="btn btn-primary fw-bold" onclick="openCreateModal()">+ Nuevo Usuario</button>
            </header>
            
            <section class="card-dash p-4">
                <div class="table-responsive">
                    <table class="table table-hover align-middle text-white">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nombre Completo</th>
                                <th>Email</th>
                                <th>Rol</th>
                                <th>Fecha Registro</th>
                                <th class="text-center">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="usersTableBody">
                            </tbody>
                    </table>
                </div>
            </section>
        </section>
    </main>

    <div class="modal fade" id="userModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content bg-dark border-secondary text-white">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title fw-bold" id="modalTitle">Nuevo Usuario</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <form id="userForm">
                    <input type="hidden" id="userId">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label small fw-bold">NOMBRE COMPLETO *</label>
                            <input type="text" id="full_name" class="form-control bg-dark text-white border-secondary" required>
                            <div class="invalid-feedback text-danger small">El nombre es obligatorio.</div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">EMAIL *</label>
                            <input type="email" id="email" class="form-control bg-dark text-white border-secondary" required>
                            <div class="invalid-feedback text-danger small">Ingresa un email válido.</div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">ROL *</label>
                            <select id="role" class="form-select bg-dark text-white border-secondary" required>
                                <option value="user">User</option>
                                <option value="coach">Coach</option>
                                <option value="admin">Admin</option>
                            </select>
                        </div>
                        <div id="passwordFields">
                            <div class="mb-3">
                                <label class="form-label small fw-bold">CONTRASEÑA *</label>
                                <input type="password" id="password" class="form-control bg-dark text-white border-secondary" minlength="8">
                                <div class="invalid-feedback text-danger small">Mínimo 8 caracteres.</div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label small fw-bold">CONFIRMAR CONTRASEÑA *</label>
                                <input type="password" id="confirm_password" class="form-control bg-dark text-white border-secondary">
                                <div class="invalid-feedback text-danger small">Las contraseñas no coinciden.</div>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer border-secondary">
                        <button type="button" class="btn btn-outline-light btn-sm" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-warning btn-sm fw-bold px-4">Guardar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/admin.js"></script>
</body>
</html>
