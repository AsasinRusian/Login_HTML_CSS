<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Acceso — SportClub</title>
    <link rel="stylesheet" href="../css/Style.Css">
</head>
<body>
    <div class="card">
        <div class="logo-wrap"><img src="../IMG/logo_empresa_letra_v1.png" alt="SportClub"></div>
        <h1 class="card-title">Bienvenido</h1>
        <div class="error-box" id="errorMsg"></div>
        <form id="loginForm">
            <div class="field"><label>Correo</label><input type="email" id="email" required></div>
            <div class="field"><label>Contraseña</label><input type="password" id="password" required></div>
            <button type="submit" class="btn-submit" id="submitBtn">Iniciar Sesión</button>
        </form>
        <div class="links"><a href="register.html">¿No tienes cuenta? Regístrate</a><a href="index.html">Inicio</a></div>
    </div>
    <script src="../js/auth.js"></script>
</body>
</html>
