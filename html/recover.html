<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar acceso — SportClub</title>
    <!-- Fuentes de Google -->
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/recover.css">
</head>
<body>
    <div class="card">
        <div class="logo-wrap">
            <img src="../IMG/logo_empresa_letra_v1.png" alt="SportClub">
        </div>
        
        <h1>Recuperar Acceso</h1>
        <p class="sub">Te enviaremos un enlace para restablecer tu contraseña. Revisa tu bandeja de entrada y spam.</p>
        
        <form id="formRecover">
            <label for="email">Correo Electrónico</label>
            <input type="email" id="email" placeholder="nombre@correo.com" required>
            <button type="submit" class="btn-submit">Enviar Enlace</button>
        </form>

        <div id="msgSuccess" class="success">
            ✓ Enlace enviado con éxito. Revisa tu correo.
        </div>

        <div class="back">
            <a href="login.html">← Volver al inicio de sesión</a>
        </div>
    </div>

    <script>
        document.getElementById('formRecover').addEventListener('submit', function(e) {
            e.preventDefault();
            // Oculta el formulario y muestra el mensaje de confirmación
            this.style.display = 'none';
            document.getElementById('msgSuccess').style.display = 'block';
        });
    </script>
</body>
</html>
