<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SportClub - Registro</title>
    <link rel="stylesheet" href="../css/register.css">
</head>
<body>
    <main class="landing-card">
        <div class="landing-card-bg"></div>
        
        <header class="header-centrado">
            <img src="../IMG/logo_empresa_letra_v1.png" alt="SportClub" class="logo-registro">
            <div class="titulo-registro">
                <h1>CREAR CUENTA</h1>
                <p>Únete a la comunidad SportClub</p>
            </div>
        </header>

        <form id="registerForm" novalidate>
            <h3 class="etiqueta-seccion">INFORMACIÓN PERSONAL</h3>
            <div class="grid-formulario">
                <label class="campo">
                    <span>NOMBRE COMPLETO *</span>
                    <input type="text" id="full_name" placeholder="Ej: Kathalyna Higuera">
                    <div class="error-msg" id="err_full_name"></div>
                </label>
                
                <label class="campo">
                    <span>FECHA DE NACIMIENTO</span>
                    <input type="date" id="birth_date">
                    <div class="error-msg" id="err_birth_date"></div>
                </label>

                <label class="campo">
                    <span>NÚMERO TELEFÓNICO *</span>
                    <input type="tel" id="phone" placeholder="+56 9 1234 5678">
                    <div class="error-msg" id="err_phone"></div>
                </label>

                <label class="campo">
                    <span>NIVEL DE EXPERIENCIA EJERCITANDO</span>
                    <select id="nivel">
                        <option value="principiante">Principiante</option>
                        <option value="intermedio">Intermedio</option>
                        <option value="avanzado">Avanzado</option>
                    </select>
                    <div class="error-msg" id="err_nivel"></div>
                </label>

                <label class="campo">
                    <span>TIPO DE DOCUMENTO *</span>
                    <select id="doc_type">
                        <option value="cedula">Cédula</option>
                        <option value="pasaporte">Pasaporte</option>
                    </select>
                    <div class="error-msg" id="err_doc_type"></div>
                </label>

                <label class="campo">
                    <span>NÚMERO DE DOCUMENTO *</span>
                    <input type="text" id="doc_num" placeholder="12.345.678-9">
                    <div class="error-msg" id="err_doc_num"></div>
                </label>
            </div>

            <h3 class="etiqueta-seccion">CREDENCIALES DE ACCESO</h3>
            <div class="grid-formulario">
                <label class="campo ancho-completo">
                    <span>CORREO ELECTRÓNICO *</span>
                    <input type="email" id="reg_email" placeholder="nombre@correo.com">
                    <div class="error-msg" id="err_reg_email"></div>
                </label>

                <label class="campo">
                    <span>CONTRASEÑA *</span>
                    <input type="password" id="reg_password" placeholder="Mín. 8 caracteres">
                    <div class="error-msg" id="err_reg_password"></div>
                </label>

                <label class="campo">
                    <span>CONFIRMAR CONTRASEÑA *</span>
                    <input type="password" id="confirm_password" placeholder="Repite tu contraseña">
                    <div class="error-msg" id="err_confirm_password"></div>
                </label>
            </div>

            <div class="terminos">
                <input type="checkbox" id="acepto">
                <label for="acepto">Acepto los <span>Términos y Condiciones</span> y la <span>Política de Privacidad</span>.</label>
                <div class="error-msg" id="err_acepto"></div>
            </div>

            <button type="submit" class="btn-principal" id="btnRegister">Crear Cuenta</button>
        </form>

        <footer class="footer-enlace">
            <a href="login.html">¿Ya tienes cuenta? &rarr; Iniciar sesión</a>
        </footer>
    </main>

    <script src="../js/auth.js"></script>
</body>
</html>
