<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SportClub - Registro</title>
    <link rel="stylesheet" href="../css/register.css">
</head>
<body>
    <main class="landing-card">
        <div class="landing-card-bg"></div>
        
        <div class="landing-card-content">
            <header class="header-centrado">
                <img src="../IMG/logo_empresa_letra_v1.png" alt="SportClub" class="logo-registro">
                <div class="titulo-registro">
                    <h1>CREAR CUENTA</h1>
                    <p>Únete a la comunidad SportClub</p>
                </div>
            </header>

            <form id="registerForm">
                <h3 class="etiqueta-seccion">INFORMACIÓN PERSONAL</h3>
                <div class="grid-formulario">
                    <div class="campo">
                        <label>NOMBRE COMPLETO *</label>
                        <input type="text" placeholder="Ej: Kathalyna Higuera" required>
                    </div>
                    <div class="campo">
                        <label>FECHA DE NACIMIENTO</label>
                        <input type="date" required>
                    </div>
                    <div class="campo">
                        <label>NÚMERO TELEFÓNICO *</label>
                        <input type="tel" placeholder="+56 9 1234 5678" required>
                    </div>
                    <div class="campo">
                        <label>NIVEL DE EXPERIENCIA EJERCITANDO</label>
                        <select>
                            <option>Principiante</option>
                            <option>Intermedio</option>
                            <option>Avanzado</option>
                        </select>
                    </div>
                    <div class="campo">
                        <label>TIPO DE DOCUMENTO *</label>
                        <select>
                            <option>Cédula</option>
                            <option>RUT</option>
                            <option>Pasaporte</option>
                        </select>
                    </div>
                    <div class="campo">
                        <label>NÚMERO DE DOCUMENTO *</label>
                        <input type="text" placeholder="12.345.678-9" required>
                    </div>
                </div>

                <h3 class="etiqueta-seccion">CREDENCIALES DE ACCESO</h3>
                <div class="grid-formulario">
                    <div class="campo ancho-completo">
                        <label>CORREO ELECTRÓNICO *</label>
                        <input type="email" placeholder="nombre@correo.com" required>
                    </div>
                    <div class="campo">
                        <label>CONTRASEÑA *</label>
                        <input type="password" placeholder="Mín. 8 caracteres" required>


                    </div>
                    <div class="campo">
                        <label>CONFIRMAR CONTRASEÑA *</label>
                        <input type="password" placeholder="Repite tu contraseña" required>
                    </div>
                </div>

                <div class="terminos">
                    <input type="checkbox" id="acepto" required>
                    <label for="acepto">Acepto los <span>Términos y Condiciones</span> y la <span>Política de Privacidad</span>.</label>
                </div>

                <button type="submit" class="btn-principal">Crear Cuenta</button>
            </form>

            <footer class="footer-enlace">
                <a href="login.html">¿Ya tienes cuenta? &rarr; Iniciar sesión</a>
            </footer>
        </div>
    </main>
</body>
</html>
