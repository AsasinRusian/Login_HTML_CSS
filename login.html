<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login - SportClub</title>
    <link rel="stylesheet" href="Style.Css">
</head>
<body>
    <main class="login-container">
        <img src="logo_empresa_letra_v1.png" alt="Logo" class="logo">
        <h2>Acceso</h2>
        <form id="login-form">
            <label for="email">Correo Electrónico</label>
            <input type="email" id="email" placeholder="Ingrese su correo." required>
            
            <label for="password">Contraseña</label>
            <input type="password" id="password" placeholder="••••••••" required>
            
            <p id="error-msg" style="color: #ff4d4d; display: none; font-size: 14px; margin-bottom: 15px;"></p>
            
            <button type="submit" class="auth-submit">Iniciar Sesión</button>
        </form>

        <nav>
            <a href="recover.html">¿Olvidaste tu contraseña?</a>
            <hr>
            <a href="register.html">¿No tienes cuenta? Regístrate aquí.</a>
            <br>
            <a href="index.html" style="margin-top: 15px; display: inline-block;">← Volver al inicio</a>
        </nav>

        <aside class="demo-hint">
            <p><strong>Cuentas de prueba:</strong></p>
            <table>
                <tr><td>Socio:</td><td>usuario@sportclub.com / user123</td></tr>
                <tr><td>Coach:</td><td>coach@sportclub.com / coach123</td></tr>
                <tr><td>Admin:</td><td>admin@sportclub.com / admin123</td></tr>
            </table>
        </aside>
    </main>

    <script>
        const USERS = {
          'usuario@sportclub.com': { password: 'user123',  role: 'usuario', redirect: 'user.html' },
          'coach@sportclub.com':   { password: 'coach123', role: 'coach',   redirect: 'coach.html' },
          'admin@sportclub.com':   { password: 'admin123', role: 'admin',   redirect: 'admin.html' },
        };

        document.getElementById('login-form').addEventListener('submit', function(e) {
          e.preventDefault();
          const email    = document.getElementById('email').value.trim().toLowerCase();
          const password = document.getElementById('password').value;
          const errorEl  = document.getElementById('error-msg');

          const user = USERS[email];

          if (!user || user.password !== password) {
            errorEl.textContent = 'Correo o contraseña incorrectos.';
            errorEl.style.display = 'block';
            return;
          }

          errorEl.style.display = 'none';
          sessionStorage.setItem('sc_user', JSON.stringify({ email, role: user.role }));
          window.location.href = user.redirect;
        });
    </script>
</body>
</html>
